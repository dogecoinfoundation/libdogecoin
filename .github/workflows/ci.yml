                mkdir -p src/openenclave/build && \
                make -j 4 -C depends HOST=x86_64-pc-linux-gnu/host ${{ matrix.dep-opts }} && \
                ./configure --prefix=${{ github.workspace }}/depends/x86_64-pc-linux-gnu/host && \
