# this ci pipeline will build, test and publish (can but currently does not) artifacts for linux, win, macosx

name: CI

on:
  push:
    branches: [ "*-dev*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    name: ${{ matrix.name }}

    env:
      CHECK_DOC: "0"
      CCACHE_SIZE: "100M"
      CCACHE_TEMPDIR: /tmp/.ccache-temp
      CCACHE_COMPRESS: "1"
      PYTHON_DEBUG: "1"
      MAC_SDK_URL: https://bitcoincore.org/depends-sources/sdks
      ANDROID_NDK_URL: https://dl.google.com/android/repository/

    strategy:
      fail-fast: false
      matrix:
        name:
          - armhf-linux
          - aarch64-linux
          - aarch64-linux-optee
          - aarch64-android
          - x86_64-linux-dbg
          - x86_64-linux-yubikey
          - x86_64-linux-avx2
          - x86_64-linux-sse
          - x86_64-linux-openenclave
          - x86_64-linux-pqc-raccoon-g
          - x86_64-linux-zk-carrier
          - x86_64-macos
          - arm64-macos
          - x86_64-win
          - x86_64-win-native
          - x86_64-win-native-rel
          - x86_64-win-native-notpm
          - i686-win
          - i686-linux
        include:
          - name: armhf-linux
            host: arm-linux-gnueabihf
            os: ubuntu-22.04
            packages: g++-arm-linux-gnueabihf qemu-user-static qemu-user
            dep-opts: "CROSS_COMPILE='yes' SPEED=slow V=1"
            config-opts: "--enable-static --disable-shared"
            run-tests: true
            goal: install
          - name: aarch64-linux
            host: aarch64-linux-gnu
            os: ubuntu-22.04
            packages: g++-aarch64-linux-gnu qemu-user-static qemu-user
            dep-opts: "CROSS_COMPILE='yes' SPEED=slow V=1"
            config-opts: "LIBS='-levent_pthreads' --enable-static --disable-shared --with-armv8-crypto --with-armv82-crypto"
            run-tests: true
            goal: install
          - name: aarch64-linux-optee
            host: aarch64-linux-gnu
            os: ubuntu-22.04
            run-tests: true
            run-container: true
            packages: g++-aarch64-linux-gnu qemu-user-static qemu-user
            dep-opts: "CROSS_COMPILE='yes' YUBIKEY=1 SPEED=slow V=1"
            config-opts: "LIBS=-levent_pthreads --enable-static --disable-shared --enable-optee CFLAGS=-Wp,-D_FORTIFY_SOURCE=0"
            goal: install
          - name: aarch64-android
            host: aarch64-linux-android
            os: ubuntu-22.04
            packages: unzip
            dep-opts: "CROSS_COMPILE='yes' SPEED=slow V=1"
            config-opts: "--enable-static --disable-shared"
            run-tests: true
            goal: install
            android-ndk: android-ndk-r25c-linux
            android-ndk-shasum: "769ee342ea75f80619d985c2da990c48b3d8eaf45f48783a2d48870d04b46108"
          - name: x86_64-linux-dbg
            host: x86_64-pc-linux-gnu
            os: ubuntu-22.04
            run-tests: true
            packages: python3-dev python3-dbg libgmp-dev libtss2-dev swtpm
            dep-opts: "DEBUG=1 SPEED=slow V=1"
            config-opts: "--enable-debug --enable-tss2"
            goal: install
          - name: x86_64-linux-yubikey
            host: x86_64-pc-linux-gnu
            os: ubuntu-22.04
            run-tests: false
            packages: libykpiv-dev libpcsclite-dev
            dep-opts: "SPEED=slow V=1"
            config-opts: "--enable-static --disable-shared --enable-yubikey"
          - name: x86_64-linux-avx2
            host: x86_64-pc-linux-gnu
            os: ubuntu-22.04
            run-tests: true
            packages: python3-dev python3-dbg
            dep-opts: "DEBUG=1 SPEED=slow V=1 NASM=1"
            config-opts: "--enable-debug --enable-intel-avx2"
            goal: install
          - name: x86_64-linux-sse
            host: x86_64-pc-linux-gnu
            os: ubuntu-22.04
            run-tests: true
            packages: python3-dev python3-dbg
            dep-opts: "DEBUG=1 SPEED=slow V=1 NASM=1"
            config-opts: "--enable-debug --enable-intel-sse"
            goal: install
          - name: x86_64-linux-openenclave
            host: x86_64-pc-linux-gnu
            os: ubuntu-22.04
            run-tests: true
            run-container: true
            packages: python3-dev python3-dbg
            dep-opts: "DEBUG=1 YUBIKEY=1 SPEED=slow V=1"
            config-opts: "--enable-openenclave CFLAGS=-Wp,-D_FORTIFY_SOURCE=0"
            goal: install
            experimental: true
          - name: x86_64-macos
            host: x86_64-apple-darwin15
            os: macos-14
            run-tests: true
            dep-opts: "SPEED=slow V=1"
            config-opts: "--enable-static --disable-shared"
            packages: cmake zlib xorriso libtool
            goal: install
            mac-sdk: 12.2
            mac-sdk-build: 12B45b
            mac-sdk-shasum: "df75d30ecafc429e905134333aeae56ac65fac67cb4182622398fd717df77619"
          - name: arm64-macos
            host: arm64-apple-darwin
            os: macos-14
            run-tests: true
            dep-opts: "SPEED=slow V=1 NO_YUBIKEY=1"
            config-opts: "--enable-static --disable-shared --enable-test-passwd --enable-dit --enable-debug"
            packages: cmake zlib xorriso libtool
            goal: install
            mac-sdk: 12.2
            mac-sdk-build: 12B45b
            mac-sdk-shasum: "df75d30ecafc429e905134333aeae56ac65fac67cb4182622398fd717df77619"
          - name: x86_64-win
            host: x86_64-w64-mingw32
            arch: i386
            os: ubuntu-22.04
            packages: python3 nsis g++-mingw-w64-x86-64 wine64 wine-stable bc wine-binfmt
            postinstall: |
              sudo dpkg -s mono-runtime && sudo apt-get remove mono-runtime || echo "Very nothing to uninstall."
              sudo update-alternatives --set x86_64-w64-mingw32-gcc  /usr/bin/x86_64-w64-mingw32-gcc-posix
              sudo update-alternatives --set x86_64-w64-mingw32-g++  /usr/bin/x86_64-w64-mingw32-g++-posix
              sudo update-binfmts --import /usr/share/binfmts/wine
            dep-opts: "CROSS_COMPILE='yes' SPEED=slow V=1"
            config-opts: ""
            run-tests: true
          - name: x86_64-win-native
            host: x86_64-pc-windows-msvc
            os: windows-2022
            packages: cmake
            postinstall: |
              choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
            dep-opts: "CROSS_COMPILE='no' SPEED=slow V=1"
            config-opts: ""
            run-tests: true
            goal: install
          - name: x86_64-win-native-rel
            host: x86_64-pc-windows-msvc
            os: windows-2022
            packages: cmake
            postinstall: |
              choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
            dep-opts: "CROSS_COMPILE='no' SPEED=slow V=1"
            config-opts: ""
            run-tests: false
            goal: install
          - name: x86_64-win-native-notpm
            host: x86_64-pc-windows-msvc
            os: windows-2022
            packages: cmake
            postinstall: |
              choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
            dep-opts: "CROSS_COMPILE='no' SPEED=slow V=1"
            config-opts: ""
            run-tests: false
            goal: install
          - name: i686-win
            host: i686-w64-mingw32
            arch: i386
            os: ubuntu-22.04
            packages: python3-pip python3-setuptools nsis g++ g++-mingw-w64-i686 mingw-w64-i686-dev wine-stable winehq-stable bc wine-binfmt binfmt-support
            preinstall: |
              OS_FLAVOR=$(cat /etc/*ease | grep UBUNTU_CODENAME | cut -d "=" -f 2)
              if [ ! -d "/etc/apt/keyrings" ]; then sudo mkdir -pm755 /etc/apt/keyrings; fi
              sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
              sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/$OS_FLAVOR/winehq-$OS_FLAVOR.sources
              sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
              sudo apt-get update -qq
              sudo apt-get install -yqq --allow-downgrades libgd3/jammy libpcre2-8-0/jammy libpcre2-16-0/jammy libpcre2-32-0/jammy
              sudo apt-get purge -yqq libmono* moby* mono* php* libgdiplus libpcre2-posix3 libzip4
            postinstall: |
              sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
              sudo update-alternatives --set i686-w64-mingw32-g++  /usr/bin/i686-w64-mingw32-g++-posix
              sudo update-binfmts --import /usr/share/binfmts/wine
            dep-opts: "CROSS_COMPILE='yes' SPEED=slow V=1"
            config-opts: ""
            run-tests: true
            goal: install
          - name: i686-linux
            host: i686-pc-linux-gnu
            os: ubuntu-22.04
            packages: g++-multilib bc
            run-tests: true
            dep-opts: "SPEED=slow V=1"
            config-opts: "--enable-static --disable-shared"
            goal: install
          - name: x86_64-linux-pqc-raccoon-g
            host: x86_64-pc-linux-gnu
            os: ubuntu-22.04
            packages: python3-dev python3-dbg
            run-tests: true
            dep-opts: "SPEED=slow V=1 LIBOQS=1 RACCOON_G=1"
            config-opts: "--enable-static --disable-shared --enable-liboqs --enable-raccoon-g"
            goal: install
          - name: x86_64-linux-zk-carrier
            host: x86_64-pc-linux-gnu
            os: ubuntu-22.04
            run-tests: true
            packages: python3-dev python3-dbg
            dep-opts: "DEBUG=1 SPEED=slow V=1 ZK_CARRIER=1"
            config-opts: "--enable-debug --enable-test-passwd --enable-zk-carrier --with-rapidsnark --with-mcl"
            goal: install

    runs-on: ${{ matrix.os }}
    # The openenclave leg builds inside a pinned focal (Ubuntu 20.04, EOL Apr 2025)
    # container whose apt sources depend on third-party CDNs still serving a focal
    # suite. Let it fail without blocking the matrix; only entries that opt in via
    # matrix.experimental are affected. See doc/enclaves.md.
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: add architecture
        if: ${{ matrix.arch }}
        run: |
          sudo dpkg --add-architecture ${{ matrix.arch }}

      - name: Pre install
        if: ${{ matrix.preinstall }}
        run: ${{ matrix.preinstall }}

      - name: install packages
        run: |
          if ([ "${{ matrix.host }}" != "x86_64-pc-windows-msvc" ]); then
            if ([ "${{ matrix.name }}" == "x86_64-macos" ] || [ "${{ matrix.name }}" == "arm64-macos" ]); then
                brew uninstall cmake
                brew update
                brew install automake coreutils ${{ matrix.packages }}
                echo PATH="/usr/local/opt/coreutils/libexec/gnubin:$PATH" >> ~/.bashrc
                source ~/.bashrc
            else
              sudo apt-get update
              DEBIAN_FRONTEND=noninteractive sudo apt-get install -y autoconf automake libtool-bin build-essential curl python3 valgrind ${{ matrix.packages }}
            fi
          fi
        shell: bash

      - name: post install
        if: ${{ matrix.postinstall }}
        run: ${{ matrix.postinstall }}

      - name: checkout
        uses: actions/checkout@v4

      - name: mac sdk cache
        if: ${{ matrix.mac-sdk }}
        uses: actions/cache@v4
        env:
          cache-name: sdk
        with:
          path: ./depends/sdk-sources
          key: ${{ matrix.name }}-${{ env.cache-name }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: install mac sdk
        if: ${{ matrix.mac-sdk }}
        env:
          sdk-filename: Xcode-${{ matrix.mac-sdk }}-${{ matrix.mac-sdk-build }}-extracted-SDK-with-libcxx-headers.tar.gz
        run: |
          mkdir -p ./depends/sdk-sources
          mkdir -p ./depends/SDKs
          echo "${{ matrix.mac-sdk-shasum }}  depends/sdk-sources/${{ env.sdk-filename }}" | sha256sum -c || \
          curl --location --fail $MAC_SDK_URL/${{ env.sdk-filename }} -o depends/sdk-sources/${{ env.sdk-filename }} &&\
          echo "${{ matrix.mac-sdk-shasum }}  depends/sdk-sources/${{ env.sdk-filename }}" | sha256sum -c
          tar -C depends/SDKs -xf depends/sdk-sources/${{ env.sdk-filename }}

      - name: android ndk cache
        if: ${{ matrix.android-ndk }}
        uses: actions/cache@v4
        env:
          cache-name: android-ndk
        with:
          path: ./depends/sdk-sources
          key: ${{ matrix.name }}-${{ env.cache-name }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: install android ndk
        if: ${{ matrix.android-ndk }}
        env:
          ndk-filename: ${{ matrix.android-ndk }}.zip
        run: |
          mkdir -p ./depends/sdk-sources
          mkdir -p ./depends/SDKs
          echo "${{ matrix.android-ndk-shasum }}  depends/sdk-sources/${{ env.ndk-filename }}" | sha256sum -c || \
          curl --location --fail $ANDROID_NDK_URL/${{ env.ndk-filename }} -o depends/sdk-sources/${{ env.ndk-filename }} &&\
          echo "${{ matrix.android-ndk-shasum }}  depends/sdk-sources/${{ env.ndk-filename }}" | sha256sum -c
          unzip depends/sdk-sources/${{ env.ndk-filename }} -d depends/SDKs

      - name: dependency cache
        uses: actions/cache@v4
        env:
          cache-name: depends
        with:
          path: ./depends/built
          key: ${{ matrix.name }}-${{ env.cache-name }}-${{ hashFiles('depends/packages/*') }}

      - name: build depends
        run: |
          make $MAKEJOBS -C depends HOST=${{ matrix.host }} ${{ matrix.dep-opts }}
        if: matrix.host != 'x86_64-pc-windows-msvc'

      - name: ccache
        uses: actions/cache@v4
        env:
          cache-name: ccache
        with:
          path: ~/.ccache
          key: ${{ matrix.name }}-${{ env.cache-name }}-${{ hashFiles('configure.ac') }}

      - name: configure libdogecoin
        run: |
          export PATH="$(pwd)/depends/${{ matrix.host }}/native/bin:$PATH"
          depends/${{ matrix.host }}/native/bin/ccache --max-size=$CCACHE_SIZE
          ./autogen.sh
          ./configure --prefix=`pwd`/depends/${{ matrix.host }} ${{ matrix.config-opts }} HOST=${{ matrix.host }} || ( cat config.log && false)
        if: matrix.host != 'x86_64-pc-windows-msvc'

      - name: build libdogecoin
        run: |
          build_dir="$(pwd)/build/libdogecoin-${{ github.sha }}-${{ matrix.name }}"
          export PATH="$(pwd)/depends/${{ matrix.host }}/native/bin:$PATH"
          mkdir -p $build_dir/bin $build_dir/docs $build_dir/examples $build_dir/include $build_dir/lib $build_dir/test/ $build_dir/test/wordlist
          if ([ "${{ matrix.name }}" == "x86_64-win-native" ]); then
            cmake -B $build_dir -DBUILD_SHARED_LIBS=1 -DTEST_TPM_AUTO=ON
            cmake --build $build_dir
          elif ([ "${{ matrix.name }}" == "x86_64-win-native-rel" ]); then
            cmake -B $build_dir -DBUILD_SHARED_LIBS=1 -DCMAKE_BUILD_TYPE=Release
            cmake --build $build_dir --config Release
          elif ([ "${{ matrix.name }}" == "x86_64-win-native-notpm" ]); then
            cmake -B $build_dir -DBUILD_SHARED_LIBS=1 -DCMAKE_BUILD_TYPE=Release USE_TPM2=FALSE
            cmake --build $build_dir --config Release
          else
            make -j"$(getconf _NPROCESSORS_ONLN)" SPEED=slow V=1
            make install prefix=/ DESTDIR=$build_dir
            mkdir -p $build_dir/docs $build_dir/examples $build_dir/test/wordlist
            cp doc/*.md $build_dir/docs/
            cp contrib/examples/example.c $build_dir/examples/
            cp test/wordlist/* $build_dir/test/wordlist/
            cp LICENSE $build_dir/
            if [ -d "$build_dir/bin" ]; then
              find "$build_dir/bin" -maxdepth 1 -type f -exec chmod +x {} \;
            fi
          fi
        shell: bash

      - name: start swtpm (Linux TSS2 coverage)
        if: ${{ matrix.name == 'x86_64-linux-dbg' }}
        run: |
          # Spin up a software TPM 2.0 emulator on a TCP socket so that the
          # test_tpm() suite (test/tpm_tests.c) exercises the TSS2 / Esys
          # encrypt/decrypt path on Linux. tcti-swtpm's default TCTI string
          # already points at 127.0.0.1:2321 (data) / :2322 (control), so no
          # extra TCTI env var is needed for libtss2 to find this swtpm.
          mkdir -p "$RUNNER_TEMP/swtpm-state"
          swtpm socket \
            --tpm2 \
            --server type=tcp,port=2321 \
            --ctrl type=tcp,port=2322 \
            --flags not-need-init \
            --tpmstate dir="$RUNNER_TEMP/swtpm-state" \
            --daemon
          # Give the daemon a moment to bind its sockets before the tests run.
          swtpm_ready=0
          for i in $(seq 1 10); do
            if ss -ltn | grep -q '127.0.0.1:2321'; then
              echo "swtpm is listening on 127.0.0.1:2321"
              swtpm_ready=1
              break
            fi
            sleep 1
          done
          if [ "$swtpm_ready" != "1" ]; then
            echo "swtpm did not start listening on 127.0.0.1:2321 after 10 seconds" >&2
            exit 1
          fi

      - name: test libdogecoin
        if: ${{ matrix.run-tests }}
        shell: bash
        run: |
            case "${{ matrix.name }}" in
              "armhf-linux")
              qemu-arm -E LD_LIBRARY_PATH=/usr/arm-linux-gnueabihf/lib/ /usr/arm-linux-gnueabihf/lib/ld-linux-armhf.so.3 ./tests
              ;;
              "aarch64-linux" | "aarch64-linux-optee")
              qemu-aarch64 -E LD_LIBRARY_PATH=/usr/aarch64-linux-gnu/lib/ /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 ./tests
              ;;
              "x86_64-linux-dbg" | "x86_64-linux-openenclave")
              make check -j"$(getconf _NPROCESSORS_ONLN)" V=1
              python3 tooltests.py
              sudo ./rpctest/fetch.py --host x86_64-linux-gnu
              sudo rm /usr/local/bin/dogecoind
              ;;
              "x86_64-win-native")
              test_exe="./build/libdogecoin-${{ github.sha }}-${{ matrix.name }}/Debug/tests.exe"
              [ -f "$test_exe" ] || test_exe="./build/libdogecoin-${{ github.sha }}-${{ matrix.name }}/tests.exe"
              "$test_exe"
              ;;
              "aarch64-android")
              wget https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip
              unzip commandlinetools-linux-6858069_latest.zip
              mkdir -p ~/.android-sdk/cmdline-tools/latest
              mv cmdline-tools/* ~/.android-sdk/cmdline-tools/latest
              export ANDROID_SDK_ROOT=~/.android-sdk
              export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
              # `yes` is expected to receive SIGPIPE once sdkmanager exits after accepting licenses.
              set +o pipefail
              yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT
              set -o pipefail
              sdkmanager --update --sdk_root=$ANDROID_SDK_ROOT
              sdkmanager "platform-tools" --sdk_root=$ANDROID_SDK_ROOT
              DOCKER_IMAGE=us-docker.pkg.dev/android-emulator-268719/images/r-google-x64:30.0.23
              PORT=15555
              container_id=$(docker run -d \
                --device /dev/kvm \
                --publish 8554:8554/tcp \
                --publish $PORT:5555/tcp \
                -e TOKEN="$(cat ~/.emulator_console_auth_token)" \
                -e ADBKEY="$(cat ~/.android/adbkey)" \
                $DOCKER_IMAGE)
              echo "The container is running with id: $container_id"
              adb connect localhost:$PORT
              adb wait-for-device
              while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
                sleep 1
              done
              echo "The device is ready"
              adb push ./tests /data/local/tmp/
              adb shell "mkdir -p /data/local/tmp/test"
              adb push ./test/wordlist /data/local/tmp/test
              adb shell "cd /data/local/tmp/; chmod 755 tests; ./tests"
              echo "docker stop ${container_id}"
              ;;
              *)
              make check -j"$(getconf _NPROCESSORS_ONLN)" V=1
              ;;
            esac

      - name: run container
        if: ${{ matrix.run-container }}
        shell: bash
        run: |
            case "${{ matrix.name }}" in
              "x86_64-linux-openenclave" | "aarch64-linux-optee")
              if ([ "${{ matrix.name }}" == "aarch64-linux-optee" ]); then
                make install
                if [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
                  printf "%s" "${{ secrets.DEFAULT_TA_PEM }}" > rsa_private.pem
                fi
                sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
                docker pull jforissier/optee_os_ci:qemu_check
                docker run -v "$(pwd):/src" -w /src jforissier/optee_os_ci:qemu_check /bin/bash -c "\
                    # Set up the environment and build the OP-TEE SDK
                    set -e && \
                    apt update && \
                    apt -y install libusb-1.0-0-dev swig python3-dev python3-setuptools e2tools && \
                    curl https://storage.googleapis.com/git-repo-downloads/repo > /bin/repo && chmod a+x /bin/repo && \
                    mkdir -p optee && \
                    cd optee && \
                    repo init -u https://github.com/OP-TEE/manifest.git -m nanopc-t6.xml -b master && \
                    export FORCE_UNSAFE_CONFIGURE=1 && \
                    repo sync -j\"$(getconf _NPROCESSORS_ONLN)\" && \
                    if [[ "${{ github.ref }}" == refs/tags/* ]]; then \
                      mv /src/rsa_private.pem /src/optee/optee_os/keys/default_ta.pem; \
                    fi && \
                    patch -F 4 /src/optee/build/common.mk < /src/src/optee/common.mk.patch && \
                    cd build && \
                    make toolchains -j\"$(getconf _NPROCESSORS_ONLN)\" && \
                    export CFG_TEE_CORE_LOG_LEVEL=0 && \
                    export CFG_ATTESTATION_PTA=y && \
                    export CFG_ATTESTATION_PTA_KEY_SIZE=1024 && \
                    export CFG_WITH_USER_TA=y && \
                    export CFG_WITH_SOFTWARE_PRNG=n && \

                    # Generate subkeys
                    openssl genrsa -out /src/optee/optee_test/ta/top_level_subkey.pem && \
                    openssl genrsa -out /src/optee/optee_test/ta/mid_level_subkey.pem && \
                    openssl genrsa -out /src/optee/optee_test/ta/identity_subkey2.pem && \

                    # Sign the top-level subkey with the root key
                    /src/optee/optee_os/scripts/sign_encrypt.py sign-subkey \
                        --uuid f04fa996-148a-453c-b037-1dcfbad120a6 \
                        --key /src/optee/optee_os/keys/default_ta.pem --in /src/optee/optee_test/ta/top_level_subkey.pem \
                        --out /src/optee/optee_test/ta/top_level_subkey.bin --max-depth 4 --name-size 64 \
                        --subkey-version 1 && \

                    # Generate UUID for the mid-level subkey
                    /src/optee/optee_os/scripts/sign_encrypt.py subkey-uuid --in /src/optee/optee_test/ta/top_level_subkey.bin \
                        --name mid_level_subkey && \

                    # Sign the mid-level subkey with the top-level subkey
                    /src/optee/optee_os/scripts/sign_encrypt.py sign-subkey \
                        --uuid 1a5948c5-1aa0-518c-86f4-be6f6a057b16 \
