            ${{ github.workspace }}/optee/optee_os/out/arm/core/tee-header_v2.bin
            ${{ github.workspace }}/optee/optee_os/out/arm/core/tee-pager_v2.bin
            ${{ github.workspace }}/optee/optee_os/out/arm/core/tee-pageable_v2.bin
